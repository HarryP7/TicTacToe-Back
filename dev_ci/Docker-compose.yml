services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: tictactoe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  api:
    build: .

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_URLS: http://+:8080